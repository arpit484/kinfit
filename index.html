<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KinFit</title>
<meta name="description" content="Workout plans, technique guides and progress tracking for you and your family. Works offline.">
<meta name="theme-color" content="#EFF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KinFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>:root{
  --bg:#EFF1EE; --surface:#FFFFFF; --surface2:#F6F7F5; --ink:#171B19; --muted:#5E6762; --line:#DCE0DC;
  --c-warm:#2E8B57; --c-main:#2F5BD3; --c-fin:#D0382F; --c-cool:#B88C05;
  --prop:#9AA59E; --tick:#2E8B57; --focus:#2F5BD3; --late:#C2410C; --late-bg:#FFF1E8; --ok-bg:#EAF6EF;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){ :root{
  color-scheme:dark; --bg:#0F1211; --surface:#181C1A; --surface2:#1F2421; --ink:#E9ECEA; --muted:#9AA39E; --line:#2B312E;
  --c-warm:#4CB47A; --c-main:#6D8FF0; --c-fin:#F0655B; --c-cool:#E5B92E; --prop:#56615A; --tick:#4CB47A; --focus:#6D8FF0; --late:#FB923C; --late-bg:#2A1C12; --ok-bg:#14251B; } }
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
body.has-timer{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 100px)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:0}
.vt{font-size:36px;line-height:1;margin-top:20px}
.muted{color:var(--muted)} .fine{font-size:12px;color:var(--muted);margin:10px 0 0} .center{text-align:center;margin:24px 0}
.btn{appearance:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{width:100%;padding:14px;font-size:16px;margin-top:14px;font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:9px;font-size:20px;line-height:1;cursor:pointer}
.icon-btn:disabled{opacity:.35}
.linkish{appearance:none;border:0;background:none;color:var(--focus);font:inherit;font-weight:600;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.card h3{font-size:20px}
.cardh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cardh>div{display:flex;gap:6px}
.note{font-size:13.5px;color:var(--muted);padding:12px 14px;border-radius:12px;border:1px dashed var(--line);margin-top:18px}
.note b{color:var(--ink)}
.alert{border-radius:12px;padding:12px 14px;margin-top:14px;background:var(--late-bg);border:1px solid color-mix(in srgb,var(--late) 35%,transparent);font-size:14px}
.alert summary{cursor:pointer} .alert ul{margin:8px 0;padding-left:18px} .alert p{margin:6px 0 0}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}

/* workout */
.topbar{display:flex;align-items:center;gap:8px;padding-top:16px}
.topbar>div{flex:1;min-width:0}
.hello{font-family:var(--disp);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1.05}
.prog-name{font-size:13px;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-block:10px 8px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 2px 8px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tab b{font-family:var(--disp);font-size:16px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.tab small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab i{display:block;width:70%;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.tab i u{display:block;height:100%;background:var(--tick)}
.tab.today{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:inherit;opacity:.75}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:10px;flex-wrap:wrap}
.dayhead h2{font-size:40px;line-height:.95}
.dayhead p{margin:4px 0 0;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.pct{font-family:var(--disp);font-size:24px;font-weight:700}
.prog small{display:block;color:var(--muted);font-size:12px}
.session{display:flex;gap:14px;align-items:center;border-radius:12px;padding:12px 14px;margin-top:14px;border:1px solid var(--line);background:var(--surface)}
.session.ok{background:var(--ok-bg)} .session.late{background:var(--late-bg);border-color:color-mix(in srgb,var(--late) 40%,transparent)}
.session.late b{color:var(--late)}
.session.done{font-weight:600;background:var(--ok-bg)}
.session small{display:block;color:var(--muted);font-size:12px}
.clockbig{font-family:var(--disp);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timeline{display:flex;height:28px;margin-top:14px;border-radius:8px;overflow:hidden;font-size:11px;font-weight:600;color:#fff}
.timeline div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 4px}
.tl-t{display:flex;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
section.block{margin-top:20px}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.plate-dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 4px rgba(255,255,255,.45)}
.bh h3{font-size:19px;letter-spacing:.05em}
.bh .when{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.item{display:grid;grid-template-columns:44px 1fr;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
.chk{display:flex;align-items:flex-start;justify-content:center;padding-top:14px;cursor:pointer}
.chk input{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin:0;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.chk input:checked{background:var(--tick);border-color:var(--tick)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
li.done .nm{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
details{min-width:0}
summary{list-style:none;cursor:pointer;padding:12px 12px 12px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
summary::-webkit-details-marker{display:none}
.nm{font-weight:600;font-size:15.5px}
.rx{grid-column:1;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rx em{font-style:normal;color:var(--ink);font-weight:500}
.how{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--c);white-space:nowrap}
.how svg{width:14px;height:14px;transition:transform .2s}
details[open] .how svg{transform:rotate(180deg)}
.sets{grid-column:2;display:flex;gap:8px;padding:0 12px 12px 0;flex-wrap:wrap}
.set{appearance:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--c);background:transparent;color:var(--ink);font:600 14px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.set.on{background:var(--c);color:#fff}
.panel{padding:0 12px 14px 0;display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:14px;align-items:start}
.stage{background:var(--surface2);border:1px solid var(--line);border-radius:10px;position:relative}
.stage svg{display:block;width:100%;height:auto}
.stage .cap{position:absolute;left:8px;top:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cues h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.cues ul{margin:0 0 10px;padding-left:18px;font-size:14px}
.cues .ok{color:var(--c-warm)} .cues .no{color:var(--c-fin)}
.links{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.links a{font-size:13px;color:var(--focus);font-weight:600;text-decoration:none}
/* figure */
.lb{stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far .lb{stroke:var(--muted);opacity:.7}
.torso{stroke-width:7} .headc{fill:var(--ink)} .floor{stroke:var(--line);stroke-width:2}
.pr{stroke:var(--prop);stroke-linecap:round} .pr-fill{fill:var(--prop)} .pr-ring{fill:none;stroke:var(--prop);stroke-width:3}
.cable{stroke:var(--prop);stroke-width:1.5;stroke-dasharray:3 2} .plate{fill:var(--c)} .hub{fill:var(--surface2)}
.ghost .lb{stroke:var(--muted)} .ghost .headc{fill:var(--muted)}

/* timer + nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
#nav button{appearance:none;border:0;background:none;color:var(--muted);font:600 11.5px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
#nav svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--ink)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:19;max-width:696px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tbar{height:4px;background:rgba(255,255,255,.2)} .tbar i{display:block;height:100%;background:var(--c-warm)}
.trow{display:flex;align-items:center;gap:8px;padding:10px 12px}
.trow>div{flex:1;min-width:0} .trow small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow b{font-family:var(--disp);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
#timer .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:80vh;overflow:auto}
.sheet-card h3{font-size:22px} .sheet-card input{width:100%;margin-top:8px}
.opts{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px}
.opt{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{font-family:var(--disp);font-size:32px;line-height:1;font-variant-numeric:tabular-nums;display:block}
.kpi small{color:var(--muted);font-size:12px;line-height:1.25;display:block;margin-top:4px}
.hmgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hmh{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.hm{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums;background:var(--surface2);border:1px solid var(--line);color:var(--muted);max-width:100%}
.hm.empty{background:none;border:0}
.hm.l1{background:color-mix(in srgb,var(--tick) 28%,var(--surface));color:var(--ink);border-color:transparent}
.hm.l2{background:color-mix(in srgb,var(--tick) 60%,var(--surface));color:var(--ink);border-color:transparent}
.hm.l3{background:var(--tick);color:#fff;border-color:transparent}
.hm.rest{background:repeating-linear-gradient(135deg,var(--surface2) 0 4px,var(--surface) 4px 8px)}
.hm.fut{opacity:.45}
.hm.now{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend .hm{width:14px;height:14px;border-radius:4px}
.lg-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)} .lg-line{width:16px;height:2px;background:var(--c-main)} .lg-goal{width:16px;border-top:2px dashed var(--c-warm)}
.wform{display:grid;grid-template-columns:1fr auto auto;gap:8px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.wform input[type=date]{width:auto}
.chartwrap{position:relative;margin-top:12px}
.wchart{width:100%;height:auto;display:block;touch-action:pan-y}
.grid{stroke:var(--line);stroke-width:1} .axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.goal{stroke:var(--c-warm);stroke-width:1.5;stroke-dasharray:5 4}
.warea{fill:color-mix(in srgb,var(--c-main) 10%,transparent)} .wline{fill:none;stroke:var(--c-main);stroke-width:2;stroke-linejoin:round}
.wdot{fill:var(--muted);opacity:.6} .wend{fill:var(--c-main);stroke:var(--surface);stroke-width:2}
.hovl{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.tip{position:absolute;top:0;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:13px;pointer-events:none;width:120px}
.tip small{display:block;opacity:.75;font-size:11px}
.empty-chart{font-size:14px;margin:10px 0}
.wstats,.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.wstats small,.rgrid small{display:block;color:var(--muted);font-size:12px}
.wstats b,.rgrid b{font-variant-numeric:tabular-nums;font-size:15px}
.wlist{margin-top:10px;font-size:14px} .wlist ul{padding-left:18px}
.report h4{margin:14px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.report ul{margin:0;padding-left:18px}
.grade{font-family:var(--disp);font-size:30px;font-weight:700;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink)}

/* me */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{background:var(--surface2);border-radius:10px;padding:10px}
.num small{display:block;font-size:11.5px;color:var(--muted)} .num b{display:block;font-size:17px;font-variant-numeric:tabular-nums} .num span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.switch{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch:last-of-type{border-bottom:0}
.switch input{appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;margin:2px 0 0;cursor:pointer;transition:background .2s;padding:0;border:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--tick)} .switch input:checked::after{left:21px}
.switch small{display:block;color:var(--muted);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field>span{font-size:13px;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.plist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:10px}
.pbtn{appearance:none;flex:1;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pbtn small{color:var(--muted)} .pbtn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* setup */
.setup{padding-bottom:30px}
.hero{text-align:center;padding:28px 0 4px}
.hero .logo svg{width:64px;height:64px}
.hero h1{font-size:44px;line-height:1;margin-top:8px}
.hero p{color:var(--muted);max-width:40ch;margin:8px auto 0}
.form .field:first-child{margin-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:14px;cursor:pointer}
.pill input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.progs{display:grid;gap:6px}
.prog-opt{display:block;cursor:pointer}
.prog-opt input{position:absolute;opacity:0;pointer-events:none}
.prog-opt>span{display:block;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;position:relative}
.prog-opt small{display:block;color:var(--muted);font-size:12.5px}
.prog-opt input:checked+span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.prog-opt input:focus-visible+span{outline:2px solid var(--focus)}
.prog-opt.dis{opacity:.4;cursor:not-allowed}
.rec{position:absolute;right:10px;top:10px;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-warm)}
.err{color:var(--c-fin);font-weight:600;min-height:1em;margin:10px 0 0}
@media (max-width:520px){
  .panel{grid-template-columns:1fr} .stage{max-width:260px}
  .nums{grid-template-columns:repeat(2,1fr)}
  .dayhead h2{font-size:34px}
  .wform{grid-template-columns:1fr auto} .wform input[type=date]{grid-column:1}
}
@media (prefers-reduced-motion:reduce){ .how svg,.switch input,.switch input::after{transition:none} }
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<div id="timer" hidden aria-live="polite"></div>

<script>// ---------- Stick-figure engine ----------
const L = { torso: 44, neck: 5, head: 8, ua: 24, fa: 22, th: 32, sh: 32, foot: 10 };
const R = a => a * Math.PI / 180;
const dv = a => [Math.sin(R(a)), Math.cos(R(a))];
const mv = (p, l, a) => { const v = dv(a); return [p[0] + v[0] * l, p[1] + v[1] * l]; };

function fill(p) {
  const q = Object.assign({ t: 0, ua: 0, fa: 0, th: 0, sh: 0 }, p);
  ['ua', 'fa', 'th', 'sh'].forEach(k => { if (q[k + '2'] === undefined) q[k + '2'] = q[k]; });
  return q;
}
function fk(p, front) {
  let hip;
  if (p.ankle) {
    const s = dv(p.sh), t = dv(p.th);
    hip = [p.ankle[0] - L.sh * s[0] - L.th * t[0], p.ankle[1] - L.sh * s[1] - L.th * t[1]];
  } else hip = p.hip;
  const tv = [Math.sin(R(p.t)), -Math.cos(R(p.t))];
  const sh = [hip[0] + tv[0] * L.torso, hip[1] + tv[1] * L.torso];
  const ht = p.t + (p.hd || 0), hv = [Math.sin(R(ht)), -Math.cos(R(ht))];
  const neck = [sh[0] + hv[0] * L.neck, sh[1] + hv[1] * L.neck];
  const head = [sh[0] + hv[0] * (L.neck + L.head), sh[1] + hv[1] * (L.neck + L.head)];
  const so = front ? 8 : 0, ho = front ? 5 : 0, m = front ? -1 : 1;
  const sN = [sh[0] + so, sh[1]], sF = [sh[0] - so, sh[1]];
  const hN = [hip[0] + ho, hip[1]], hF = [hip[0] - ho, hip[1]];
  const J = { hip, sh, neck, head, tv, sN, sF, hN, hF, curve: p.curve || 0 };
  J.elbow = mv(sN, L.ua, p.ua); J.hand = mv(J.elbow, L.fa, p.fa);
  J.elbow2 = mv(sF, L.ua, m * p.ua2); J.hand2 = mv(J.elbow2, L.fa, m * p.fa2);
  J.knee = mv(hN, L.th, p.th); J.ankle = mv(J.knee, L.sh, p.sh);
  J.knee2 = mv(hF, L.th, m * p.th2); J.ankle2 = mv(J.knee2, L.sh, m * p.sh2);
  if (front) { J.toe = [J.ankle[0] + 6, J.ankle[1]]; J.toe2 = [J.ankle2[0] - 6, J.ankle2[1]]; }
  else {
    J.toe = mv(J.ankle, L.foot, p.ft !== undefined ? p.ft : p.sh + 90);
    J.toe2 = mv(J.ankle2, L.foot, p.ft2 !== undefined ? p.ft2 : p.sh2 + 90);
  }
  return J;
}
function lerpPose(a, b, k) {
  const o = {};
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  keys.forEach(key => {
    const x = a[key], y = b[key] === undefined ? x : b[key];
    const x2 = x === undefined ? y : x;
    if (Array.isArray(x2)) o[key] = x2.map((v, i) => v + (y[i] - v) * k);
    else if (typeof x2 === 'number') o[key] = x2 + (y - x2) * k;
    else o[key] = k < .5 ? x2 : y;
  });
  return o;
}
const f1 = n => n.toFixed(1);
const ln = (a, b, c, w) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" class="${c}"${w ? ` stroke-width="${w}"` : ''}/>`;

function propSVG(pr, J, layer) {
  const at = n => J[n];
  let s = '';
  pr.forEach(p => {
    const front = ['plate', 'db', 'kb', 'pad'].includes(p.k);
    if ((layer === 'front') !== front) return;
    switch (p.k) {
      case 'bench': s += `<rect x="${p.x1}" y="${p.y}" width="${p.x2 - p.x1}" height="6" rx="2" class="pr-fill"/>` +
        ln([p.x1 + 6, p.y + 6], [p.x1 + 6, 150], 'pr', 3) + ln([p.x2 - 6, p.y + 6], [p.x2 - 6, 150], 'pr', 3); break;
      case 'line': s += ln([p.p[0], p.p[1]], [p.p[2], p.p[3]], 'pr', p.w || 6); break;
      case 'cable': { const t = at(p.to || 'hand'); s += ln(p.from, t, 'cable') + `<circle cx="${p.from[0]}" cy="${p.from[1]}" r="4" class="pr-fill"/>`; break; }
      case 'bar': s += ln([p.x1, p.y], [p.x2, p.y], 'pr', 4); break;
      case 'wall': s += ln([p.x, 20], [p.x, 150], 'pr', 4); break;
      case 'rail': s += ln([p.x1, p.y], [p.x2, p.y], 'pr', 4); break;
      case 'deck': s += `<rect x="40" y="150" width="125" height="6" rx="3" class="pr-fill"/>`; break;
      case 'platform': { const t = at(p.at), v = dv(p.a), l = p.len || 16; s += ln([t[0] - v[0] * l, t[1] - v[1] * l], [t[0] + v[0] * l, t[1] + v[1] * l], 'pr', 5); break; }
      case 'bike': s += `<circle cx="150" cy="134" r="15" class="pr-ring"/>` + ln([88, 100], [110, 132], 'pr', 3) + ln([110, 132], [150, 134], 'pr', 3) + ln([150, 134], [142, 84], 'pr', 3) + ln([76, 97], [98, 97], 'pr', 5) + ln([136, 82], [150, 82], 'pr', 5); break;
      case 'plate': { const t0 = at(p.at || 'hand'), t = [t0[0] + (p.dx || 0), t0[1] + (p.dy || 0)]; s += `<circle cx="${f1(t[0])}" cy="${f1(t[1])}" r="${p.r || 11}" class="plate"/><circle cx="${f1(t[0])}" cy="${f1(t[1])}" r="2.5" class="hub"/>`; break; }
      case 'db': [p.at || 'hand'].concat(p.both ? ['hand2'] : []).forEach(n => { const t = at(n); s += `<rect x="${f1(t[0] - 7)}" y="${f1(t[1] - 3)}" width="14" height="6" rx="2" class="plate"/>`; }); break;
      case 'kb': { const t = at('hand'); s += `<circle cx="${f1(t[0])}" cy="${f1(t[1] + 8)}" r="7" class="plate"/>`; break; }
      case 'pad': { const t = at(p.at); s += `<circle cx="${f1(t[0])}" cy="${f1(t[1] - (p.dy || 0))}" r="5" class="pr-fill"/>`; break; }
    }
  });
  return s;
}
function bodySVG(J, cls) {
  const [hx, hy] = J.hip, [sx, sy] = J.sh;
  const mid = [(hx + sx) / 2, (hy + sy) / 2], n = [-J.tv[1], J.tv[0]];
  const bulge = [-Math.cos(Math.atan2(J.tv[0], -J.tv[1])), 0];
  // perpendicular toward the back side
  const tr = R(Math.atan2(J.tv[0], -J.tv[1]) * 180 / Math.PI);
  const back = [-Math.cos(tr), -Math.sin(tr)];
  const c = [mid[0] + back[0] * J.curve, mid[1] + back[1] * J.curve];
  let s = '';
  // far limbs
  s += `<g class="${cls} far">` + ln(J.sF, J.elbow2, 'lb') + ln(J.elbow2, J.hand2, 'lb') + ln(J.hF, J.knee2, 'lb') + ln(J.knee2, J.ankle2, 'lb') + ln(J.ankle2, J.toe2, 'lb', 4) + `</g>`;
  s += `<g class="${cls} near">`;
  s += `<path d="M${f1(hx)} ${f1(hy)} Q${f1(c[0])} ${f1(c[1])} ${f1(sx)} ${f1(sy)}" class="lb torso"/>`;
  s += ln(J.sh, J.neck, 'lb', 5) + `<circle cx="${f1(J.head[0])}" cy="${f1(J.head[1])}" r="${L.head}" class="headc"/>`;
  s += ln(J.hN, J.knee, 'lb') + ln(J.knee, J.ankle, 'lb') + ln(J.ankle, J.toe, 'lb', 4);
  s += ln(J.sN, J.elbow, 'lb') + ln(J.elbow, J.hand, 'lb');
  s += `</g>`;
  return s;
}
function drawExercise(ex, k, ghost) {
  const A = fill(ex.A), B = fill(ex.B || ex.A);
  const P = lerpPose(A, B, k);
  const J = fk(P, ex.front);
  const pr = ex.props || [];
  let s = `<line x1="4" y1="150" x2="196" y2="150" class="floor"/>`;
  if (ghost) { const G = fk(A, ex.front); s += `<g opacity=".22">${bodySVG(G, 'ghost')}${propSVG(pr, G, 'front')}</g>`; }
  s += propSVG(pr, J, 'back') + bodySVG(J, 'fig') + propSVG(pr, J, 'front');
  return s;
}

function rxFor(p, i, kind) {

  if (kind === 'preg') return { rx: '2 × 10–12', rest: '60 s' };
  if (lvl === 'beginner' || (p.age || 30) >= 50) return { rx: '3 × 10–12', rest: i === 0 ? '90 s' : '60 s' };
  if (g === 'muscle') return i === 0 ? { rx: '4 × 6–8', rest: '2 min' } : { rx: '3 × 8–12', rest: '75 s' };
  return i === 0 ? { rx: '4 × 8–10', rest: '90 s' } : { rx: '3 × 10–12', rest: '60 s' };

function mapId(p, id) {
  let x = id;
  if (p.level === 'beginner' || (p.age || 30) >= 50) x = BEGIN_MAP[x] || x;
  (p.limits || []).forEach(l => { x = (LIMIT_MAP[l] || {})[x] || x; });
  if (bmi(p) >= 30 || (p.limits || []).includes('knee')) x = LOW_IMPACT[x] || x;
  return x;
}
function dedupe(list) { const s = new Set(); return list.filter(i => (s.has(i.id) ? false : s.add(i.id))); }

function warmFor(kind, p) {
  if (kind === 'lower') return [it('bike', '3 min'), it('legswing', '10 / leg'), it('bridge', '× 12'), it('bwsquat', '× 10'), it('wgs', '× 4 / side')];
  if (kind === 'full') return [it('walk', '3 min'), it('armcircle', '10 each way'), it('catcow', '× 8'), it('bwsquat', '× 10'), it('wgs', '× 3 / side')];
  return [it('walk', '3 min'), it('armcircle', '10 each way'), it('passthru', '× 12'), it('catcow', '× 8'), it('wgs', '× 4 / side')];
}
function coolFor(kind) {
  if (kind === 'lower') return CD_LEGS.slice(0, 3);
  if (kind === 'full') return [it('hipflex', '30 s / side'), it('chest', '30 s / side'), it('hamstring', '40 s')];
  return CD_PUSH.slice(0, 3);
}
function finFor(p, kind) {
  const heavy = bmi(p) >= 30 || (p.limits || []).includes('knee');
  if (p.goal === 'muscle') return [it('plank', '2 × 40 s')];
  if (heavy) return [it('inclwalk', '5 min, incline 8–12%')];
  return kind === 'lower' ? [it('inclwalk', '5 min')] : [it('bike', '6 × 20 s hard / 40 s easy', { label: 'Bike sprints' })];
}

function buildDay(p, tpl, kind) {
  const n = mainCount(p.minutes || 45);
  let main;
  if (kind === 'yoga') {
    const cnt = Math.min(tpl.list.length, (p.minutes || 30) <= 20 ? 5 : (p.minutes || 30) <= 30 ? 6 : 8);
    main = tpl.list.slice(0, cnt).map(id => it(mapId(p, id), id === 'sunsal' ? '4–6 rounds' : id === 'breath' ? '3 min' : id === 'legsup' ? '3 min' : '5 slow breaths'));
    return { name: tpl.name, focus: tpl.focus, type: 'yoga', warm: [it('breath', '2 min'), it('catcow', '× 6')], main: dedupe(main), fin: [], cool: [it('savasana', '3–5 min')] };
  }
  if (kind === 'home') {
    main = tpl.list.slice(0, n + 1).map((id, i) => {
      const r = rxFor(p, i, 'home');
      return tpl.circuit ? it(mapId(p, id), '3 rounds × 40 s on / 20 s off', { rest: i === n ? '90 s after round' : undefined, circuit: true }) : it(mapId(p, id), /plank|wallsit/.test(id) ? (p.level === 'beginner' ? '2 × 20 s' : '3 × 40 s') : r.rx, { rest: r.rest });
    });
    return { name: tpl.name, focus: tpl.focus, type: 'home', warm: [it('march', '2 min'), it('armcircle', '10 each way'), it('catcow', '× 8'), it('bwsquat', '× 8')], main: dedupe(main), fin: [], cool: [it('hamstring', '40 s'), it('hipflex', '30 s / side'), it('child', '40 s')] };
  }
  if (kind === 'senior') {
    main = tpl.list.map((id, i) => { const r = rxFor(p, i, 'senior'); return it(mapId(p, id), id === 'balance' ? '3 × 20 s / leg' : id === 'march' ? '2 min' : r.rx, { rest: r.rest }); });
    return { name: tpl.name, focus: tpl.focus, type: 'senior', warm: [it('march', '3 min'), it('armcircle', '10 each way'), it('standcatcow', '× 6')], main: dedupe(main).slice(0, n + 1), fin: [it('walkeasy', '10 min')], cool: [it('standham', '30 s / leg'), it('chest', '30 s'), it('sidebend', '20 s / side')] };

  // gym
  const list = tpl.list.slice(0, n).map((id, i) => { const r = rxFor(p, i, 'gym'); const x = mapId(p, id); return it(x, /plank|hkr/.test(x) ? '3 × 40 s' : r.rx, { rest: r.rest }); });
  return { name: tpl.name, focus: tpl.focus, type: 'gym', warm: warmFor(tpl.kind, p), main: dedupe(list), fin: finFor(p, tpl.kind), cool: coolFor(tpl.kind) };
}

  $('#stime').onchange = e => { p.startTime = e.target.value || '07:15'; save(); };
  $('#editp').onclick = () => { EDIT = p.id; render(); };
  const rs = $('#resetsw'); if (rs) rs.onclick = () => { p.swaps = {}; save(); render(); toast('Back to the original exercises'); };
  $('#ssave').onclick = () => { p.syncUrl = $('#surl').value.trim(); p.syncKey = $('#skey').value.trim(); save(); queueAll(p); trySync(true); };
  $('#srestore').onclick = restore;
  document.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => { STORE.active = b.dataset.pid; save(); VIEW = 'workout'; SEL = wdIdx(new Date()); WEEK_OFF = 0; render(); });
  document.querySelectorAll('[data-delp]').forEach(b => b.onclick = () => {
    if (CONFIRM !== b.dataset.delp) { CONFIRM = b.dataset.delp; b.textContent = 'Tap again to delete'; return; }
    CONFIRM = null; delete STORE.profiles[b.dataset.delp]; STORE.order = STORE.order.filter(i => i !== b.dataset.delp); save(); render();
  });
  $('#addp').onclick = () => { EDIT = 'new'; render(); };
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(STORE, null, 1)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `kinfit-backup-${iso(today())}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  $('#imp').onchange = e => {
    const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const v = JSON.parse(r.result); if (!v.profiles) throw 0; Object.assign(STORE.profiles, v.profiles); v.order.forEach(id => { if (!STORE.order.includes(id)) STORE.order.push(id); }); if (!STORE.active) STORE.active = v.active; save(); toast('Backup restored'); render(); } catch (err) { toast('That file isn’t a KinFit backup'); } };
    r.readAsText(f);
  };
}

// ================= SETUP / EDIT PROFILE =================
function renderSetup() {
  const isNew = EDIT === 'new' || !P() || !EDIT, p = !isNew ? STORE.profiles[EDIT] : {};
  const v = (k, d) => p[k] != null ? p[k] : d;
  const opt = (name, val, cur, label) => `<label class="pill"><input type="radio" name="${name}" value="${val}" ${String(cur) === String(val) ? 'checked' : ''}><span>${label}</span></label>`;
  return `<div class="setup">
  ${!P() ? `<div class="hero"><div class="logo">${logoSVG()}</div><h1>KinFit</h1><p>Your workout plan, technique guide and progress tracker — for you and your family. Works offline.</p></div>` : `<h1 class="vt">${isNew ? 'Add a person' : 'Edit profile'}</h1>`}
  <form id="pform" class="card form" novalidate>
    <label class="field"><span>Name</span><input id="f-name" required maxlength="30" value="${esc(v('name', ''))}" autocomplete="given-name"></label>
    <div class="field"><span>Sex</span><div class="pills">${opt('sex', 'M', v('sex', 'M'), 'Male')}${opt('sex', 'F', v('sex', 'M'), 'Female')}</div></div>
    <div class="grid3"><label class="field"><span>Age</span><input id="f-age" type="number" inputmode="numeric" min="12" max="95" required value="${v('age', '')}"></label>
    <label class="field"><span>Height (cm)</span><input id="f-height" type="number" inputmode="numeric" min="120" max="220" required value="${v('height', '')}"></label>
    <label class="field"><span>Weight (kg)</span><input id="f-weight" type="number" step="0.1" inputmode="decimal" min="30" max="250" required value="${v('weight', '')}"></label></div>
    <div class="field" id="pregrow"><span>Pregnant?</span><div class="pills">${opt('tri', 0, v('trimester', 0), 'No')}${opt('tri', 1, v('trimester', 0), '1st trimester')}${opt('tri', 2, v('trimester', 0), '2nd')}${opt('tri', 3, v('trimester', 0), '3rd')}</div>
      <label class="switch" id="docrow"><input type="checkbox" id="f-doc" ${v('doctorOk', false) ? 'checked' : ''}><span><b>My doctor has approved exercise</b><small>Required for the pregnancy plan beyond walking</small></span></label></div>
    <div class="field"><span>Main goal</span><div class="pills">${opt('goal', 'fatloss', v('goal', 'fatloss'), 'Lose fat')}${opt('goal', 'muscle', v('goal', 'fatloss'), 'Build muscle')}${opt('goal', 'fitness', v('goal', 'fatloss'), 'Stay fit')}${opt('goal', 'flex', v('goal', 'fatloss'), 'Flexibility & stress')}</div></div>
    <div class="field"><span>Where will you train?</span><div class="pills">${opt('where', 'gym', v('where', 'gym'), 'Gym')}${opt('where', 'home', v('where', 'gym'), 'Home')}</div></div>
    <div class="field"><span>Experience</span><div class="pills">${opt('level', 'beginner', v('level', 'beginner'), 'Beginner')}${opt('level', 'intermediate', v('level', 'beginner'), 'Intermediate')}${opt('level', 'advanced', v('level', 'beginner'), 'Advanced')}</div></div>
    <div class="field"><span>Any pain to work around?</span><div class="pills">${['knee', 'back', 'shoulder'].map(l => `<label class="pill"><input type="checkbox" name="lim" value="${l}" ${(v('limits', []) || []).includes(l) ? 'checked' : ''}><span>${l[0].toUpperCase() + l.slice(1)}</span></label>`).join('')}</div></div>
    <div class="grid3"><label class="field"><span>Days / week</span><select id="f-days">${[2, 3, 4, 5, 6].map(d => `<option ${+v('days', 3) === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
    <label class="field"><span>Minutes</span><select id="f-min">${[20, 30, 45, 60].map(d => `<option ${+v('minutes', 30) === d ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
    <label class="field"><span>Start time</span><input id="f-time" type="time" value="${esc(v('startTime', '07:15'))}"></label></div>
    <div class="field"><span>Program <small id="recnote"></small></span><div class="progs" id="progs">${Object.entries(PROGRAMS).map(([k, pr]) => `<label class="prog-opt"><input type="radio" name="program" value="${k}" ${v('program', '') === k ? 'checked' : ''}><span><b>${pr.name}</b><small>${pr.desc}</small><em class="rec" hidden>Recommended</em></span></label>`).join('')}</div></div>
    <label class="switch"><input type="checkbox" id="f-nomat" ${v('noMat', false) ? 'checked' : ''}><span><b>No mat — use standing stretches</b><small>For gyms where floor space or mats are a problem</small></span></label>
    <p class="err" id="ferr" role="alert"></p>
    <div class="row">${P() ? '<button type="button" class="btn" id="fcancel">Cancel</button>' : ''}<button class="btn primary big">${isNew ? 'Create my plan' : 'Save changes'}</button></div>
  </form></div>`;
}
function bindSetup() {
  const f = $('#pform');
  const val = n => { const e = f.querySelector(`input[name="${n}"]:checked`); return e ? e.value : null; };
  const upd = () => {
    const sex = val('sex'), tri = +val('tri') || 0;
    $('#pregrow').hidden = sex !== 'F'; $('#docrow').hidden = !(sex === 'F' && tri > 0);
    const q = { sex, trimester: sex === 'F' ? tri : 0, age: +$('#f-age').value, goal: val('goal'), where: val('where') };
    const rec = recommendProgram(q);
    f.querySelectorAll('.prog-opt').forEach(o => { const k = o.querySelector('input').value; o.querySelector('.rec').hidden = k !== rec;
      const block = (q.trimester > 0 && k !== 'preg') || (k === 'preg' && !q.trimester); o.classList.toggle('dis', block); o.querySelector('input').disabled = block; if (block) o.querySelector('input').checked = false; });
    if (!val('program')) { const r = f.querySelector(`input[name=program][value="${rec}"]`); if (r && !r.disabled) r.checked = true; }
    const pp = val('program') === 'ppl'; $('#f-days').disabled = pp; $('#f-min').disabled = pp;
    $('#recnote').textContent = q.trimester ? '— pregnancy plan only while pregnant' : '';
  };
  f.addEventListener('change', upd); f.addEventListener('input', e => { if (e.target.id === 'f-age') upd(); }); upd();
  const c = $('#fcancel'); if (c) c.onclick = () => { EDIT = null; render(); };
  f.onsubmit = e => {
    e.preventDefault();
    const name = $('#f-name').value.trim(), age = +$('#f-age').value, height = +$('#f-height').value, weight = +$('#f-weight').value, program = val('program');
    const err = !name ? 'Enter a name' : !(age >= 12 && age <= 95) ? 'Enter an age between 12 and 95' : !(height >= 120 && height <= 220) ? 'Enter height in cm (120–220)' : !(weight >= 30 && weight <= 250) ? 'Enter weight in kg (30–250)' : !program ? 'Choose a program' : '';
    if (err) { $('#ferr').textContent = err; return; }
    const sex = val('sex');
    const data = { name, sex, age, height, weight, goal: val('goal'), where: val('where'), level: val('level'), limits: [...f.querySelectorAll('input[name=lim]:checked')].map(i => i.value),
      trimester: sex === 'F' ? +val('tri') || 0 : 0, doctorOk: $('#f-doc').checked, program, days: program === 'ppl' ? 6 : +$('#f-days').value, minutes: program === 'ppl' ? 45 : +$('#f-min').value,
      startTime: $('#f-time').value || '07:15', noMat: $('#f-nomat').checked };
    if (data.program === 'preg') data.minutes = Math.min(data.minutes, 45);
    if (EDIT && EDIT !== 'new' && STORE.profiles[EDIT]) Object.assign(STORE.profiles[EDIT], data);
    else { const np = newProfile(data); STORE.profiles[np.id] = np; STORE.order.push(np.id); STORE.active = np.id; np.weights.push({ date: iso(today()), kg: weight }); }
    EDIT = null; VIEW = 'workout'; SEL = wdIdx(new Date()); save(); render(); toast('Plan ready');
  };
}
function logoSVG() { return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="var(--c-main)"/><circle cx="32" cy="32" r="18" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/><circle cx="32" cy="32" r="6" fill="#fff"/></svg>`; }

// ================= SYNC =================
function sessionRow(p, ds) {
  const s = stats(p, ds), L = p.log[ds] || {};
  const doneNames = items(s.day).filter(x => L.done && isDone(L, x)).map(x => (EX[resolveId(p, x.id)] || {}).name || x.text || x.id);
  return { type: 'session', id: p.id + '-s-' + ds, date: ds, profile: p.name, program: PROGRAMS[p.program].short, day: s.day.name, percent: Math.round(s.pct * 100), done: s.n, total: s.total,
    minutes: L.started && L.finished ? Math.round((L.finished - L.started) / 60000) : '', exercises: doneNames.join(', '), json: JSON.stringify(L) };
}
let QT = {};
function queueSession(p, ds) { clearTimeout(QT[ds]); QT[ds] = setTimeout(() => queueRow(p, sessionRow(p, ds)), 1500); }
function queueRow(p, row) { if (!p.syncUrl) return; p.pending = p.pending || {}; p.pending[row.id] = row; save(); trySync(); }
function queueAll(p) { Object.keys(p.log).forEach(ds => { if (Object.keys(p.log[ds].done || {}).length || Object.keys(p.log[ds].sets || {}).length) p.pending[p.id + '-s-' + ds] = sessionRow(p, ds); }); p.weights.forEach(w => { p.pending[p.id + '-w-' + w.date] = { type: 'weight', id: p.id + '-w-' + w.date, date: w.date, profile: p.name, kg: w.kg }; }); save(); }
let SYNCING = false;
async function trySync(loud) {
  const p = P(); if (!p || !p.syncUrl || SYNCING) return;
  const rows = Object.values(p.pending || {}); if (!rows.length) { if (loud) toast('Everything is already synced'); return; }
  if (!navigator.onLine) { if (loud) toast('Offline — will sync when you’re back online'); return; }
  SYNCING = true;
  try {
    const res = await fetch(p.syncUrl, { method: 'POST', redirect: 'manual', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: p.syncKey, rows }) });
    if (res.type !== 'opaqueredirect') { const j = await res.json(); if (!j.ok) throw new Error(j.error || 'Sheet refused the data'); }
    rows.forEach(r => { if (p.pending[r.id] === r) delete p.pending[r.id]; });
    p.lastSync = Date.now(); save(); if (loud) toast(`Synced ${rows.length} item${rows.length > 1 ? 's' : ''} to Google Sheet`);
  } catch (e) { if (loud) toast('Sync failed: ' + (e.message && e.message.length < 60 ? e.message : 'check the URL and key')); }
  SYNCING = false; if (VIEW === 'me' && !EDIT) render();
}
async function restore() {
  const p = P(); if (!p.syncUrl) return;
  try {
    const res = await fetch(p.syncUrl + (p.syncUrl.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(p.syncKey || '') + '&profile=' + encodeURIComponent(p.name));
    const j = await res.json(); if (!j.ok) throw new Error(j.error || 'refused');
    let n = 0;
    (j.sessions || []).forEach(r => { if (r.profile !== p.name) return; try { const L = JSON.parse(r.json); if (L && (L.done || L.sets)) { p.log[r.date] = { done: L.done || {}, sets: L.sets || {}, started: L.started, finished: L.finished }; n++; } } catch (e) {} });
    (j.weights || []).forEach(r => { if (r.profile !== p.name) return; p.weights = p.weights.filter(w => w.date !== r.date); p.weights.push({ date: r.date, kg: +r.kg }); n++; });
    save(); toast(`Restored ${n} records`); render();
  } catch (e) { toast('Restore failed — check the URL and key'); }
}
window.addEventListener('online', () => trySync());

// ---------- toast ----------
let TT; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(TT); TT = setTimeout(() => t.hidden = true, 2600); }

// ---------- boot ----------
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { VIEW = b.dataset.v; CONFIRM = null; EDIT = null; if (VIEW === 'workout') { SEL = wdIdx(new Date()); WEEK_OFF = 0; } render(); window.scrollTo(0, 0); });
render();
if (P()) { const L = P().log[iso(today())]; if (L && L.started && !L.finished) wake(true); }
trySync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
</body>
</html>
